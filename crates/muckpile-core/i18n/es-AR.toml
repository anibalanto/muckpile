help.what.pull = "Trae o actualiza una vista: un ítem, un sprint o una consulta."
help.usage.push = "push <vista>"
help.what.push = "Sube lo commiteado: resuelve los borradores y manda los cuerpos editados."
help.usage.title = "title <id> <título>"
help.what.title = "Cambia el título."
help.usage.transition = "transition <id> <estado>"
help.what.transition = "Lleva el ítem a ese estado, con la transición del workflow."
help.usage.parent = "parent <id> <padre>"
help.what.parent = "Cambia el padre."
help.usage.link = "link <a> <frase> <b>"
help.what.link = "Crea una relación, con una frase del proveedor."
help.usage.unlink = "unlink <a> <frase> <b>"
help.what.unlink = "Quita la relación que link crearía."
help.usage.comment = "comment <id> <archivo> [--reply-to <id>] (--ai <modelo> | --i-human)"
help.what.comment = "Manda un comentario, que dice quién lo escribió."
help.usage.attach = "attach <id> <archivo>"
help.what.attach = "Sube un adjunto."

