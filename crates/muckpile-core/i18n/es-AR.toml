help.what.code-work = "Dentro de una vista de trabajo, agrega el worktree de un repo del proyecto."
help.usage.sprint = "sprint fetch"
help.what.sprint = "Una vista vacía por cada sprint abierto del board."
help.usage.sprint-create = "sprint create <nombre>"
help.what.sprint-create = "Crea un sprint en el board, con ese nombre. Queda futuro y sin vista."
help.usage.sprint-add = "sprint add <sprint> <id>..."
help.what.sprint-add = "Mueve esos ítems al sprint, nombrado por su id o por el slug de su vista."
help.usage.states = "states discover"
help.what.states = "Los estados del workflow, con su categoría, guardados para --category."
help.usage.show = "show <id> [--local]"
help.what.show = "Muestra un ítem: header, cuerpo y datos, del proveedor o, con --local, de la vista."
