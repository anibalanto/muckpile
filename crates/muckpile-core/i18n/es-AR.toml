# What muckpile says, in es-AR. Each key names one message; its data goes
# between braces, with the same names as in en.toml.

usage.all = "uso: muckpile init <proyecto> | muckpile to-work <id> [--empty] | muckpile pull [id | backlog/sprint/<sprint> | query/<nombre> [--query <consulta>]] | muckpile sprint fetch | muckpile transition <id> <estado> | muckpile states discover | muckpile list <vista> [--state <estado>] [--category <categoria>] [--parent <id>] | muckpile status <vista> | muckpile push <vista> | muckpile link <a> <frase> <b> | muckpile unlink <a> <frase> <b> | muckpile title <id> <título> | muckpile parent <id> <padre> | muckpile comment <id> <archivo> [--reply-to <id>] (--ai <modelo> | --i-human) | muckpile attach <id> <archivo> | muckpile new <tipo> <título> [--parent <id>] [--blocks <id>] | muckpile show <id> [--local] | muckpile code-work add <repo> [--from <rama>] [--branch <rama>]"
usage.list = "uso: muckpile list <vista> [--state <estado>] [--category <categoria>] [--parent <id>]"

