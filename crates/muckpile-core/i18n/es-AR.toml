help.what.list = "Lista los ítems de una vista, sin red."
help.usage.status = "status <vista>"
help.what.status = "Compara la vista con el proveedor, sin escribir."
help.usage.new = "new <tipo> <título> [--parent <id>] [--blocks <id>]"
help.what.new = "Escribe un borrador @slug, sin red: queda local hasta que se lo commitea."
