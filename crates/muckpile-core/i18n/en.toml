# What muckpile says, in English — also what any language falls back to
# for a message it lacks. Each key names one message; its data goes between
# braces, with the same names as in es-AR.toml.

usage.one = "usage: muckpile {usage}"
usage.unknown = "{command}: not a muckpile command — muckpile --help lists them"
help.header = "usage: muckpile <command> [arguments]"
help.footer = "With auto_update = false, the commands that write to the provider ask for a phrase first.\nOutput is in the language of MUCKPILE_LANG (en or es-AR), or of the locale."
help.group.project = "Project and views"
help.group.read = "Reading"
help.group.sync = "Drafts and syncing"
help.group.write = "Writing to the provider"
help.usage.init = "init <project>"
help.what.init = "Makes a project: its ledger, a muckpile.toml to fill in, and the four folders."
help.usage.to-work = "to-work <id> [--empty]"
help.what.to-work = "Opens an item's work view and brings the item; with --empty, leaves it empty."
help.usage.code-work = "code-work add <repo> [--from <branch>] [--branch <branch>]"
help.what.code-work = "Inside a work view, adds a worktree of one of the project's repos."
help.usage.sprint = "sprint fetch"
help.what.sprint = "An empty view for every open sprint on the board."
help.usage.sprint-create = "sprint create <name>"
help.what.sprint-create = "Makes a sprint on the board, with that name. It stays future, and gets no view."
help.usage.states = "states discover"
help.what.states = "The workflow's statuses, with their category, cached for --category."
help.usage.show = "show <id> [--local]"
help.what.show = "Shows an item: header, body and data, from the provider or, with --local, from the view."
help.usage.list = "list <view> [--state <status>] [--category <category>] [--parent <id>]"
help.what.list = "Lists a view's items, offline."
help.usage.status = "status <view>"
help.what.status = "Compares the view against the provider, without writing."
help.usage.new = "new <type> <title> [--parent <id>] [--blocks <id>]"
help.what.new = "Writes an @slug draft, offline: it stays local until it's committed."
help.usage.pull = "pull [<id> | backlog/sprint/<sprint> | query/<name>] [--query <query>]"
help.what.pull = "Brings or updates a view: an item, a sprint or a query."
help.usage.push = "push <view>"
help.what.push = "Sends what's committed: resolves the drafts and sends the edited bodies."
help.usage.title = "title <id> <title>"
help.what.title = "Changes the title."
help.usage.transition = "transition <id> <status>"
help.what.transition = "Moves the item to that status, through the workflow's transition."
help.usage.parent = "parent <id> <parent>"
help.what.parent = "Changes the parent."
help.usage.link = "link <a> <phrase> <b>"
help.what.link = "Creates a relation, with one of the provider's phrases."
help.usage.unlink = "unlink <a> <phrase> <b>"
help.what.unlink = "Removes the relation link would create."
help.usage.comment = "comment <id> <file> [--reply-to <id>] (--ai <model> | --i-human)"
help.what.comment = "Sends a comment that says who wrote it."
help.usage.attach = "attach <id> <file>"
help.what.attach = "Uploads an attachment."

