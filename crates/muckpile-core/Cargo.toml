[package]
name = "muckpile-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# A fork of 0.1.0: whitespace at the edge of emphasis kept outside its
# delimiters, and a table with merged cells escaped whole instead of split.
# The repository the published package names isn't reachable.
atlassian-markdown-converter = { git = "https://github.com/anibalanto/atlassian-markdown-converter", rev = "91407e50340bf1a18befb4a60c74ca2d0c25ba89" }

[dev-dependencies]
tempfile = "3"
